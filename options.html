<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <title>Pengaturan Mentari Helper</title>
  <style>
    :root { --primary: rgb(13, 71, 161); --bg: #f5f5f5; --card: #fff; --text: #424242; --strong: #212121; --muted: #757575;
      --field: rgba(0,0,0,.23); --ok: #2e7d32; --err: #d32f2f; color-scheme: light; }
    :root[data-theme="dark"] { --primary: color-mix(in srgb, rgb(13, 71, 161) 40%, white); --bg: #121212; --card: #1e1e1e;
      --text: rgba(255,255,255,.87); --strong: #fff; --muted: rgba(255,255,255,.6); --field: rgba(255,255,255,.23);
      --ok: #66bb6a; --err: #f44336; color-scheme: dark; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px;
      font: 15px/1.5 "GitLab Sans", Poppins, system-ui, Arial, sans-serif; color: var(--text); background: var(--bg); }
    main { width: min(520px, 100%); padding: 28px; border-radius: 10px; background: var(--card);
      box-shadow: 0 5px 5px -3px rgba(0,0,0,.2), 0 8px 10px 1px rgba(0,0,0,.14), 0 3px 14px 2px rgba(0,0,0,.12); }
    h1 { margin: 0 0 4px; font-size: 20px; color: var(--strong); }
    p { margin: 0 0 16px; color: var(--muted); font-size: 14px; }
    label { display: block; font-size: 13px; color: var(--muted); }
    input { display: block; width: 100%; margin-top: 6px; padding: 10px 14px; font: inherit; color: var(--text); background: transparent;
      border: 1px solid var(--field); border-radius: 10px; outline: none; }
    input:focus { border-color: var(--primary); box-shadow: 0 0 0 1px var(--primary); }
    .row { display: flex; gap: 8px; margin-top: 12px; }
    button { flex: 1; min-height: 42px; padding: 8px 16px; border-radius: 10px; cursor: pointer; font: 500 14px inherit;
      font-family: inherit; text-transform: uppercase; }
    #save { border: 0; color: #fff; background: rgb(13, 71, 161); }
    #clear { border: 1px solid var(--field); color: var(--text); background: none; }
    button:hover { filter: brightness(.9); }
    #status { margin-top: 12px; min-height: 22px; font-size: 14px; }
    .ok { color: var(--ok); } .err { color: var(--err); }
    a { color: var(--primary); }
    footer { margin-top: 20px; text-align: center; font-size: 12px; color: var(--muted); }
    footer b { color: var(--primary); }
  </style>
</head>
<body>
  <main>
    <h1>Pengaturan AI</h1>
    <p>Gemini API key dipakai untuk bantuan quiz dan forum. Key hanya disimpan di browser ini dan hanya dikirim ke Google Gemini.
      Halaman ini terpisah dari Mentari supaya key tidak pernah ada di halaman website.</p>
    <label for="key">Gemini API key</label>
    <input id="key" type="password" autocomplete="off" spellcheck="false" placeholder="AQ.Ab... atau AIza...">
    <div class="row">
      <button id="save">Simpan key</button>
      <button id="clear">Hapus key</button>
    </div>
    <div id="status"></div>
    <p style="margin-top:12px">Buat key gratis di <a href="https://aistudio.google.com/apikey" target="_blank" rel="noopener noreferrer">aistudio.google.com/apikey</a>.</p>
    <footer>Mentari Helper · made by <b>Rex</b></footer>
  </main>
  <script src="lib.js"></script>
  <script src="options.js"></script>
</body>
</html>
